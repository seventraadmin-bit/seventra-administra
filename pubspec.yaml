name: riseg_one
description: "RISEG ONE — Sistema Integral Administrativo de Seguridad Privada RISEG."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado y DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Base de datos
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # Autenticación (Etapa 11A) — hashing de contraseña (PBKDF2-HMAC-SHA256).
  # Ya estaba resuelto de forma transitiva (drift/sqlite3 lo arrastran);
  # se declara directo porque ahora `lib/core/auth` lo importa.
  crypto: ^3.0.7
  # SHA-256 por streaming del respaldo (Etapa 4B) — ya venía de forma
  # transitiva; se declara directo porque `huella_archivo.dart` importa
  # `AccumulatorSink` explícitamente.
  convert: ^3.1.2

  # Cifrado reversible de credenciales (Etapa 9D) — AES-256-GCM para la
  # contraseña de la cuenta de un teléfono (necesita poder recuperarse,
  # a diferencia de `crypto`, que solo hashea de forma irreversible).
  encrypt: ^5.0.3
  # Clave maestra guardada en el Almacén de Credenciales de Windows —
  # nunca en el archivo .sqlite ni en el código fuente. Ver
  # `lib/core/security/credential_cipher.dart`.
  flutter_secure_storage: ^9.2.2

  # Adjuntos (Etapa 4I.2.2) — selección de archivo del sistema; abrir un
  # adjunto usa el programa predeterminado del SO vía dart:io, sin
  # dependencia adicional.
  file_picker: ^8.1.6

  # Rutas / navegación
  go_router: ^14.6.2

  # Logging
  logger: ^2.5.0

  # Preferencias de UI (no de negocio)
  shared_preferences: ^2.3.3

  # Localización
  intl: ^0.19.0

  # Generación de PDF (Etapa 5E) — solo generación de bytes; abrir el
  # archivo resultante reutiliza `AttachmentStorage.abrir` (programa
  # predeterminado del SO), nunca un visor propio, así que no se agrega
  # el paquete `printing`.
  pdf: ^3.11.3

  # Generación de XLSX (Etapa 12D) — solo escritura de workbooks en
  # memoria; abrir el archivo resultante reutiliza `AttachmentStorage.abrir`
  # igual que los PDF, nunca un editor propio embebido.
  excel: ^4.0.6

  # Respaldo y restauración (Etapa 14C) — ya estaban resueltos de forma
  # transitiva (excel arrastra `archive`; drift/sqlite3_flutter_libs
  # arrastran `sqlite3`); se declaran directos porque ahora
  # `lib/features/respaldo` los importa explícitamente: `sqlite3` para
  # abrir una conexión aislada de solo lectura (Database.backup,
  # PRAGMA integrity_check/user_version) sin tocar la conexión Drift
  # viva, `archive` para empaquetar/extraer el `.zip` del respaldo.
  sqlite3: ^2.9.4
  archive: ^3.6.1

  # Respaldo portable cifrado (Etapa 4D) — ya estaba resuelto de forma
  # transitiva (`encrypt` lo arrastra); se declara directo porque ahora
  # `lib/core/security/aes_gcm_hkdf_streaming.dart` lo importa
  # explícitamente para AES-GCM y HKDF-SHA256, y `Argon2BytesGenerator`
  # para derivar la clave de la frase de recuperación. Mismo criterio
  # que se siguió con `sqlite3`/`archive` en la Etapa 14C.
  #
  # PointyCastle aporta las primitivas; el framing del payload
  # (wire format AES-GCM-HKDF-STREAMING) lo implementa RISEG ONE.
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  riverpod_generator: ^2.6.3
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
