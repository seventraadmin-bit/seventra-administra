name: riseg_one
description: "RISEG ONE — Sistema Integral Administrativo de Seguridad Privada RISEG."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado y DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Base de datos
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # Adjuntos (Etapa 4I.2.2) — selección de archivo del sistema; abrir un
  # adjunto usa el programa predeterminado del SO vía dart:io, sin
  # dependencia adicional.
  file_picker: ^8.1.6

  # Rutas / navegación
  go_router: ^14.6.2

  # Logging
  logger: ^2.5.0

  # Preferencias de UI (no de negocio)
  shared_preferences: ^2.3.3

  # Localización
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  riverpod_generator: ^2.6.3
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
